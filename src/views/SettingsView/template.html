<div class="page settings-page">
  <Transition name="toast-float">
    <div v-if="toast.visible" class="toast-float" :class="[`toast-${toast.type}`]">
      <svg v-if="toast.type === 'success'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <svg v-else width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
      <span>{{ toast.message }}</span>
    </div>
  </Transition>

  <div v-if="!settingsStore.initialized" class="settings-loading">
    <div class="settings-loading-spinner"></div>
    <span>正在加载设置...</span>
  </div>

  <template v-else>
  <div class="settings-layout">
    <nav class="settings-nav">
      <div class="settings-nav-inner">
        <button
          v-for="tab in tabs"
          :key="tab.key"
          class="settings-nav-item"
          :class="{ active: activeTab === tab.key }"
          @click="activeTab = tab.key"
        >
          <component :is="tab.icon" :size="18" class="nav-icon" />
          <span class="nav-label">{{ tab.label }}</span>
        </button>
      </div>
    </nav>

    <main class="settings-main">
      <!-- AI 模型 -->
      <div v-if="activeTab === 'ai'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">AI 模型配置</h2>
          <p class="section-desc">管理大语言模型接入，配置 Agent 行为。</p>
        </div>

        <div v-if="aiConfigWarning" class="settings-alert settings-alert-warning">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <strong>配置不完整</strong>
            <span>{{ aiConfigWarning }}</span>
          </div>
        </div>

        <div class="settings-card">
          <div class="card-header-row">
            <h3 class="card-heading">Agent 参数</h3>
            <button class="btn-primary btn-save" @click="saveAiAgent">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
          </div>
          <div class="form-body">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Agent 最大研究步数</label>
                <input
                  class="input"
                  type="number"
                  min="4"
                  max="20"
                  step="1"
                  v-model.number="formAi.maxSteps"
                />
                <span class="form-hint">范围 4 – 20 步</span>
              </div>
            </div>
            <div class="form-group form-group-switch">
              <span class="form-label">显示完整轨迹</span>
              <label class="switch">
                <input type="checkbox" v-model="formAi.traceVerbose" />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="provider-list">
          <div class="provider-list-header">
            <span class="section-sublabel">AI 模型配置</span>
            <button class="btn-ghost btn-add-provider" @click="handleAddProvider">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              添加
            </button>
          </div>
          <ai-provider-card
            v-for="provider in settingsStore.settings.ai.providers"
            :key="provider.id"
            :provider="provider"
            :is-active="settingsStore.settings.ai.activeProviderId === provider.id"
            :testing="testingId === provider.id"
            :testing-result="provider.id === testingId ? testingResult : ''"
            :proxies="allProxies"
            @update="handleUpdateProvider"
            @toggle-enabled="handleToggleEnabled"
            @set-active="handleSetActive"
            @test="handleTestConnection"
            @remove="handleRemoveProvider"
          />
          <div v-if="!settingsStore.settings.ai.providers.length" class="empty-hint">
            点击上方「添加」按钮配置 AI 模型
          </div>
        </div>
      </div>

      <!-- 搜索 -->
      <div v-if="activeTab === 'search'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">搜索引擎配置</h2>
          <p class="section-desc">配置实时搜索数据源，为 AI 评估补充新闻、政策和市场情报。</p>
        </div>

        <div v-if="aiConfigWarning" class="settings-alert settings-alert-warning">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
          <div>
            <strong>搜索源未就绪</strong>
            <span>请至少启用并配置一个搜索源，否则 AI 评估无法补充实时新闻、政策和国际消息面。</span>
          </div>
        </div>

        <div class="provider-list">
          <div v-for="provider in settingsStore.settings.ai.diagnosis.searchProviders" :key="provider.id" class="settings-card ai-provider-card" :class="{ active: settingsStore.settings.ai.diagnosis.activeSearchProviderId === provider.id }">
            <div class="provider-header" @click="toggleSearchProvider(provider.id)">
              <div class="provider-info">
                <span class="provider-name">{{ provider.name }}</span>
                <span v-if="settingsStore.settings.ai.diagnosis.activeSearchProviderId === provider.id" class="tag tag-info">优先搜索源</span>
                <span v-else-if="provider.enabled" class="tag tag-neutral">已启用</span>
              </div>
              <div class="provider-header-actions">
                <span class="provider-toggle" :class="{ expanded: expandedSearchProviders.includes(provider.id) }">›</span>
                <label class="switch" @click.stop>
                  <input type="checkbox" :checked="provider.enabled" @change="handleToggleSearchProvider(provider.id, $event)" />
                  <span class="slider"></span>
                </label>
              </div>
            </div>
            <div v-if="expandedSearchProviders.includes(provider.id) && provider.enabled" class="provider-body">
              <div class="section-desc provider-hint">{{ getSearchProviderHint(provider) }}</div>
              <div class="field-grid">
                <label>
                  <span class="form-label">搜索地址</span>
                  <input class="input" :class="{ 'input-error': !provider.apiUrl && provider.enabled }" :value="provider.apiUrl" :placeholder="getSearchProviderUrlPlaceholder(provider)" @change="handleSearchProviderFieldChange(provider.id, 'apiUrl', $event.target.value)" />
                </label>
                <label>
                  <span class="form-label">访问密钥</span>
                  <input class="input" :class="{ 'input-error': !provider.apiKey && getSearchProviderRequiresKey(provider) }" type="password" :value="provider.apiKey" :placeholder="getSearchProviderKeyPlaceholder(provider)" @change="handleSearchProviderFieldChange(provider.id, 'apiKey', $event.target.value)" />
                </label>
                <label>
                  <span class="form-label">代理</span>
                  <select class="input select-input" :value="provider.proxyId || ''" @change="handleSearchProviderFieldChange(provider.id, 'proxyId', $event.target.value)">
                    <option value="">不使用代理</option>
                    <option v-for="p in allProxies.filter(pr => pr.enabled)" :key="p.id" :value="p.id">{{ p.name }}</option>
                  </select>
                </label>
              </div>
              <div class="provider-footer">
                <button v-if="settingsStore.settings.ai.diagnosis.activeSearchProviderId !== provider.id" class="btn-primary" @click="handleSetActiveSearchProvider(provider.id)">设为优先源</button>
                <button class="btn-primary btn-save" @click="saveSearchProvider(provider.id)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  保存
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 数据源 -->
      <div v-if="activeTab === 'datasource'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">数据源管理</h2>
          <p class="section-desc">管理行情数据接入方式，配置实时推送策略和外部数据源。</p>
        </div>

        <div class="settings-card">
          <div class="card-header-row">
            <h3 class="card-heading">推送设置</h3>
            <button class="btn-primary btn-save" @click="saveDataSourceOptions">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
          </div>
          <div class="form-body">
            <div class="form-group form-group-switch">
              <span class="form-label">实时推送</span>
              <label class="switch">
                <input type="checkbox" v-model="formDataSource.realTimeEnabled" />
                <span class="slider"></span>
              </label>
            </div>
            <div v-if="formDataSource.realTimeEnabled" class="form-group">
              <label class="form-label">刷新间隔</label>
              <select class="input select-input" v-model.number="formDataSource.refreshInterval">
                <option :value="3">3 秒</option>
                <option :value="5">5 秒</option>
                <option :value="10">10 秒</option>
                <option :value="30">30 秒</option>
                <option :value="60">60 秒</option>
              </select>
            </div>
          </div>
        </div>

        <data-source-table
          v-if="configurableDataSources.length"
          :sources="configurableDataSources"
          :proxies="allProxies"
          @toggle="handleToggleDataSource"
          @update="handleUpdateDataSource"
        />
        <p v-else class="section-desc">当前没有需要手动配置的外部数据源。</p>
      </div>

      <!-- 代理 -->
      <div v-if="activeTab === 'proxy'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">代理服务器</h2>
          <p class="section-desc">配置代理服务器，用于访问境外数据源或大模型 API。每个数据源和大模型可单独选择使用的代理。</p>
        </div>

        <div class="settings-card settings-card--toolbar">
          <div class="toolbar-row">
            <span class="toolbar-info">共 {{ allProxies.length }} 个代理</span>
            <button class="btn-primary" @click="handleAddProxy">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新增代理
            </button>
          </div>
        </div>

        <div v-if="allProxies.length" class="proxy-grid">
          <div v-for="proxy in allProxies" :key="proxy.id" class="settings-card proxy-card">
            <div class="proxy-card-head">
              <div class="proxy-title-row">
                <strong>{{ proxy.name || '未命名代理' }}</strong>
                <span class="tag" :class="proxy.enabled ? 'tag-positive' : 'tag-neutral'">
                  {{ proxy.enabled ? '已启用' : '已禁用' }}
                </span>
              </div>
              <div class="proxy-head-actions">
                <label class="switch">
                  <input type="checkbox" :checked="proxy.enabled" @change="handleProxyFieldChange(proxy.id, 'enabled', $event.target.checked)" />
                  <span class="slider"></span>
                </label>
                <button class="btn-ghost danger" @click="handleRemoveProxy(proxy.id)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  删除
                </button>
              </div>
            </div>
            <div class="field-grid">
              <label>
                <span class="form-label">名称</span>
                <input class="input" :class="{ 'input-error': !proxy.name }" :value="proxy.name" placeholder="代理名称" @change="handleProxyFieldChange(proxy.id, 'name', $event.target.value)" />
              </label>
              <label>
                <span class="form-label">协议</span>
                <select class="input select-input" :value="proxy.protocol" @change="handleProxyFieldChange(proxy.id, 'protocol', $event.target.value)">
                  <option value="http">HTTP</option>
                  <option value="socks5">SOCKS5</option>
                </select>
              </label>
              <label>
                <span class="form-label">地址</span>
                <input class="input" :class="{ 'input-error': !proxy.host }" :value="proxy.host" placeholder="127.0.0.1" @change="handleProxyFieldChange(proxy.id, 'host', $event.target.value)" />
              </label>
              <label>
                <span class="form-label">端口</span>
                <input class="input" type="number" :value="proxy.port" placeholder="7890" @change="handleProxyFieldChange(proxy.id, 'port', parseInt($event.target.value) || 7890)" />
              </label>
              <label>
                <span class="form-label">用户名 (可选)</span>
                <input class="input" :value="proxy.username" placeholder="留空则不认证" @change="handleProxyFieldChange(proxy.id, 'username', $event.target.value)" />
              </label>
              <label>
                <span class="form-label">密码 (可选)</span>
                <input class="input" type="password" :value="proxy.password" placeholder="留空则不认证" @change="handleProxyFieldChange(proxy.id, 'password', $event.target.value)" />
              </label>
            </div>
            <div class="proxy-card-footer">
              <button class="btn-primary btn-save" @click="saveProxy(proxy.id)">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                保存
              </button>
            </div>
          </div>
        </div>
        <div v-else class="settings-empty">暂无代理配置，点击上方「新增代理」添加。</div>
      </div>

      <!-- 通知 -->
      <div v-if="activeTab === 'notify'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">通知管理</h2>
          <p class="section-desc">配置桌面通知与消息推送通道。</p>
        </div>

        <div class="settings-card">
          <div class="card-header-row">
            <h3 class="card-heading">桌面通知</h3>
            <button class="btn-primary btn-save" @click="saveNotification">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              保存
            </button>
          </div>
          <div class="form-body">
            <div class="form-group form-group-switch">
              <span class="form-label">桌面通知</span>
              <label class="switch">
                <input type="checkbox" v-model="formNotify.desktopEnabled" />
                <span class="slider"></span>
              </label>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <div class="card-header-row">
            <h3 class="card-heading">消息推送通道</h3>
            <button class="btn-primary" @click="addChannel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              新增通知
            </button>
          </div>
          <div v-if="allChannels.length" class="channel-grid">
            <article v-for="channel in allChannels" :key="channel.id" class="channel-card">
              <div class="channel-card-head">
                <div>
                  <div class="channel-title-row">
                    <strong>{{ channel.name }}</strong>
                    <span class="tag tag-info">{{ channelTypeLabel(channel.channelType) }}</span>
                    <span class="tag" :class="channelStatuses[channel.id]?.listening ? 'tag-positive' : channelStatuses[channel.id]?.loggedIn ? 'tag-neutral' : 'tag-down'">
                      {{ channelStatuses[channel.id]?.status || '未登录' }}
                    </span>
                  </div>
                  <div class="section-desc channel-meta">
                    {{ channelStatuses[channel.id]?.accountId ? `账号 ${channelStatuses[channel.id]?.accountId}` : '当前还没有扫码绑定账号' }}
                  </div>
                </div>
                <div class="channel-actions">
                  <button v-if="channel.channelType === 'wechat'" class="btn-ghost" @click="startChannelLogin(channel)">扫码登录</button>
                  <button v-if="channel.channelType === 'wechat'" class="btn-ghost" @click="logoutChannel(channel.id)">退出</button>
                  <button class="btn-ghost danger" @click="removeChannel(channel.id)">删除</button>
                </div>
              </div>

              <div class="field-grid">
                <label>
                  <span class="form-label">通道名称</span>
                  <input class="input" :class="{ 'input-error': !channel.name }" :value="channel.name" @change="handleChannelFieldChange(channel.id, 'name', $event.target.value)" />
                </label>
                <label v-if="channel.channelType === 'wechat'">
                  <span class="form-label">服务地址</span>
                  <input class="input" :class="{ 'input-error': !channel.baseUrl }" :value="channel.baseUrl" placeholder="https://ilinkai.weixin.qq.com" @change="handleChannelFieldChange(channel.id, 'baseUrl', $event.target.value)" />
                </label>
              </div>

              <div v-if="qrSessions[channel.id]?.qrcodeImg" class="qr-card">
                <img :src="qrSessions[channel.id].qrcodeImg" alt="扫码登录二维码" />
                <div>扫码状态：{{ qrSessions[channel.id].status }}</div>
              </div>

              <div v-if="channelStatuses[channel.id]?.error" class="channel-error">
                {{ channelStatuses[channel.id].error }}
              </div>

              <div class="channel-card-footer">
                <button class="btn-primary btn-save" @click="saveChannel(channel.id)">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                  保存
                </button>
              </div>
            </article>
          </div>
          <div v-else class="settings-empty">还没有通知通道，点击上方「新增通知」添加。</div>
        </div>
      </div>

      <!-- 版本更新 -->
      <div v-if="activeTab === 'update'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">版本更新</h2>
          <p class="section-desc">检查并安装最新版本。</p>
        </div>

        <div class="settings-card">
          <div class="update-summary">
            <div class="update-version-card">
              <span class="update-label">当前版本</span>
              <strong>v{{ appUpdateStore.currentVersion }}</strong>
            </div>
            <div class="update-version-card">
              <span class="update-label">最新版本</span>
              <strong>{{ appUpdateStore.availableUpdate ? `v${appUpdateStore.availableUpdate.version}` : '--' }}</strong>
            </div>
            <div class="update-version-card">
              <span class="update-label">检查时间</span>
              <strong>{{ formatDateTime(appUpdateStore.lastCheckedAt) }}</strong>
            </div>
            <div class="update-version-card">
              <span class="update-label">更新状态</span>
              <strong class="update-status-text" :class="appUpdateStatusTone">{{ appUpdateStatusLabel }}</strong>
            </div>
          </div>

          <div class="form-group form-group-switch" style="margin-top: 16px;">
            <span class="form-label">启动时自动检查更新</span>
            <label class="switch">
              <input type="checkbox" :checked="settingsStore.settings.appUpdate.autoCheck" @change="handleAppUpdateAutoCheck" />
              <span class="slider"></span>
            </label>
          </div>

          <div class="update-actions">
            <button class="btn-primary" :disabled="appUpdateStore.isBusy" @click="handleCheckAppUpdate">
              {{ appUpdateStore.status === 'checking' ? '检查中...' : '检查更新' }}
            </button>
            <button
              class="btn-ghost"
              :disabled="appUpdateStore.isBusy || !appUpdateStore.availableUpdate"
              @click="handleInstallAppUpdate"
            >
              {{ appUpdateStore.status === 'downloading' || appUpdateStore.status === 'installing' ? '安装中...' : '下载并安装' }}
            </button>
          </div>

          <div v-if="appUpdateStore.progress" class="update-progress">
            <div class="update-progress-top">
              <span>{{ appUpdateProgressLabel }}</span>
              <span>{{ appUpdateStore.progress.percent ?? '--' }}%</span>
            </div>
            <div class="update-progress-track">
              <div class="update-progress-fill" :style="{ width: `${appUpdateStore.progress.percent ?? 0}%` }"></div>
            </div>
          </div>

          <div v-if="appUpdateStore.availableUpdate?.publishedAt" class="endpoint-card">
            <span>发布时间</span>
            <code>{{ formatDateTime(appUpdateStore.availableUpdate.publishedAt) }}</code>
          </div>

          <div v-if="appUpdateStore.availableUpdate?.notes" class="update-notes">
            <div class="update-notes-title">版本说明</div>
            <pre>{{ appUpdateStore.availableUpdate.notes }}</pre>
          </div>

          <div v-if="appUpdateStore.errorMessage" class="channel-error">
            {{ appUpdateStore.errorMessage }}
          </div>
        </div>
      </div>

      <!-- 外观 -->
      <div v-if="activeTab === 'appearance'" class="settings-section">
        <div class="section-header">
          <h2 class="section-heading">外观设置</h2>
          <p class="section-desc">自定义主题和显示偏好。</p>
        </div>

        <div class="settings-card">
