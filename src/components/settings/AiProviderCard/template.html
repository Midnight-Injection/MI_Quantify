<div class="ai-provider-card" :class="{ active: isActive }">
  <div class="provider-header" @click="toggleExpanded">
    <div class="provider-info">
      <span class="provider-name">{{ provider.name || '未命名' }}</span>
      <span v-if="isActive" class="tag tag-positive">已激活</span>
      <span v-else-if="provider.enabled" class="tag tag-neutral">已启用</span>
      <span v-else class="tag tag-info">未启用</span>
    </div>
    <div class="provider-header-actions">
      <span class="provider-toggle" :class="{ expanded }">›</span>
      <label class="switch" @click.stop>
        <input type="checkbox" :checked="provider.enabled" @change="$emit('toggle-enabled', provider.id, $event.target.checked)" />
        <span class="slider"></span>
      </label>
    </div>
  </div>
  <div v-if="expanded" class="provider-body">
    <div class="form-group">
      <label>名称</label>
      <input class="input" v-model="form.name" placeholder="如 DeepSeek、OpenAI" />
    </div>
    <div class="form-group">
      <label>API 地址</label>
      <input class="input" :class="{ 'input-error': !form.apiUrl && formTouched }" v-model="form.apiUrl" placeholder="基地址，如 https://api.deepseek.com/v1" />
    </div>
    <div class="form-group">
      <label>API Key</label>
      <div class="key-input">
        <input class="input" :class="{ 'input-error': !form.apiKey && formTouched }" :type="showKey ? 'text' : 'password'" v-model="form.apiKey" placeholder="sk-..." />
        <button type="button" class="btn-eye" @click="showKey = !showKey">{{ showKey ? '🙈' : '👁' }}</button>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group flex-1">
        <label>模型</label>
        <input class="input" :class="{ 'input-error': !form.model && formTouched }" v-model="form.model" placeholder="model-name" />
      </div>
      <div class="form-group">
        <label>温度 ({{ form.temperature }})</label>
        <input type="range" class="range-input" v-model.number="form.temperature" min="0" max="2" step="0.1" />
      </div>
    </div>
    <div class="form-group">
      <label>代理</label>
      <select class="input select-input" v-model="form.proxyId">
        <option value="">不使用代理</option>
        <option v-for="p in enabledProxies" :key="p.id" :value="p.id">{{ p.name }}</option>
      </select>
    </div>
    <div class="provider-actions">
      <button class="btn-primary btn-save" @click="handleSave">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        保存
      </button>
      <button class="btn-ghost" :disabled="testing" @click="$emit('test', provider)">
        {{ testing ? '测试中...' : '测试连接' }}
      </button>
      <button v-if="testingResult" class="btn-ghost" :class="{ 'text-success': testingResult === '连接成功', 'text-danger': testingResult !== '连接成功' }">
        {{ testingResult }}
      </button>
      <button v-if="!isActive && provider.enabled" class="btn-primary" @click="$emit('set-active', provider.id)">
        设为激活
      </button>
      <button class="btn-ghost btn-remove" @click.stop="$emit('remove', provider.id)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        删除
      </button>
    </div>
  </div>
</div>
